[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sedforge"
dynamic = ["version"]
description = "Flux-based photometric SED fitter for stellar astronomy"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "SED-fit contributors" },
]
keywords = [
  "astronomy",
  "astrophysics",
  "photometry",
  "spectral energy distribution",
  "SED fitting",
  "MCMC",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "astropy>=5.1",
  "matplotlib>=3.5",
  "emcee>=3.1",
  "corner>=2.2",
  "PyYAML>=6.0",
  "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "h5py>=3.8",
  "pytest>=7.0",
  "ruff>=0.4",
]
photometry = [
  "astroquery>=0.4.9",
]
svo = [
  "requests>=2.28",
]
hdf5 = [
  "h5py>=3.8",
]

[project.scripts]
sedforge = "sedforge.main:main"

[tool.setuptools.dynamic]
version = { attr = "sedforge.__version__" }

[tool.setuptools.packages.find]
include = ["sedforge*"]

[tool.setuptools.package-data]
sedforge = [
  "*.dat",
  "*.yaml",
  "transmission_curves/*.dat",
]

[tool.pytest.ini_options]
testpaths = ["sedforge/tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E741",
]
